server {
  listen 8080;
  root /usr/share/nginx/html;
  # API enforces 20 MiB per file; allow multipart overhead through the proxy.
  client_max_body_size 21m;

  location /api/ {
    proxy_pass http://chat-flow-api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://chat-flow-api:3001/health;
  }

  location / {
    try_files $uri /index.html;
  }
}
